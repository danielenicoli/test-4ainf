
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La mia pagina web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 50px;
        }

        .contenitore {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #0001;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="contenitore">
        <h1>Benvenuto!</h1>
        <p>Questa è la mia prima pagina HTML.</p>
        <button onclick="saluta()">Cliccami</button>
    </div>

    <script>
        function saluta() {
            alert("Ciao! Benvenuto nella mia pagina web.");
        }
    </script>
</body>
</html>
